</style>
<script>
(() => {
  'use strict';
  const root = document.getElementById('tpl02-workbench');
  const $ = selector => root.querySelector(selector);
  const $$ = selector => [...root.querySelectorAll(selector)];
  const esc = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const clone = value => JSON.parse(JSON.stringify(value));
  const icon = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;
  const icons = () => { if (globalThis.lucide) globalThis.lucide.createIcons({attrs:{width:16,height:16}}); };
  // Explicit coordinate fixtures only. These are NOT PSD inspection results.
  // Production already projects CanvasWidth/Height + FrameId + layer evidence + bounds.
  const geometryFixtures = {
    normal:{width:600,height:900,boxes:[[42,126,516,690]],dividers:[.085,.93]},
    two:{width:900,height:900,boxes:[[36,164,348,636],[452,108,400,702]],dividers:[.07,.93]},
    four:{width:600,height:1000,boxes:[[28,105,364,236],[338,275,230,320],[45,548,304,264],[260,758,310,190]],dividers:[.065,.95]},
    long:{width:600,height:3200,boxes:[[36,130,522,660],[110,1020,430,660],[32,1950,486,560],[84,2820,472,288]],dividers:[.27,.56,.83]},
    vertical:{width:600,height:1300,boxes:[[40,120,518,468],[90,720,460,505]],dividers:[.06,.49,.97]},
    size:{width:600,height:780,boxes:[[34,112,532,446]],dividers:[.08,.82]}
  };
  const makePage = (alias, name, requirements, condition, layout = '', type = 'photo') => {
    const g=geometryFixtures[type==='size'?'size':layout||'normal'];
    const targets=g.boxes.map((bounds,i)=>({layerId:`demo-layer-${alias}-${i+1}`,bounds,registered:i<requirements.length,supported:true,decorative:false}));
    targets.push({layerId:`demo-fixed-logo-${alias}`,bounds:[12,12,90,30],registered:false,supported:true,decorative:true});
    targets.push({layerId:`demo-unproven-smart-object-${alias}`,bounds:[150,24,160,36],registered:false,supported:false,decorative:false});
    return {id:`demo-page-${alias}`,alias,name,type,condition,layout,removed:false,selected:null,
      preview:{width:g.width,height:g.height,targets,dividers:g.dividers,source:'coordinate-fixture-not-psd'},
      frames:requirements.map((text,i)=>({id:`demo-frame-${alias}-${i+1}`,layerId:targets[i]?.layerId,label:type==='size'?'尺码表区域':`框${i+1}`,text,enabled:true})),structure:true};
  };
  const mainPage = () => makePage(1,'01-主色展示.psd',['主色正面全身图，完整展示服装轮廓'],'每款一次 · 主色展示');
  const detailsPage = () => makePage(2,'02-长版细节.psd',['主色领口近景，保留领部结构','主色袖口近景，保留袖口纹理','主色面料细节，呈现真实质感','主色下摆近景，不裁断边缘'],'每款一次 · 以上四框使用同一主色','long');
  const secondaryPage = () => makePage(5,'05-副色正反面.psd',['当前副色正面，全身完整','同一个副色反面，全身完整'],'每个副色一次 · 两框同色','vertical');
  const sizePage = () => makePage(6,'06-尺码说明.psd',['根据本款尺码图换数据，沿用模板样式；缺失数据不猜测'],'每款一次 · 正式出图时核对尺码来源','','size');
  const scenes = {
    R4:()=>[mainPage(),detailsPage(),secondaryPage(),sizePage()],
    R1:()=>[makePage(1,'01-主副色同页.psd',['主色正面全身图','副色正面全身图'],'每款一次 · 右框副色待指定','two')],
    R2:()=>[makePage(1,'01-单色展示.psd',['主色正面全身图'],'奇数时先使用一次'),makePage(2,'02-双色展示.psd',['分配到本页的第一个颜色正面','分配到本页的第二个颜色正面'],'剩余颜色两两一组 · 偶数时主色排第一','two')],
    R3:()=>[1,2,3,4].map(n=>makePage(n,`0${n}-颜色展示.psd`,Array.from({length:n},(_,i)=>`分配到本页的第${i+1}个颜色正面`),`恰有 ${n} 个颜色时使用一次`,n===2?'two':n>=3?'four':'')),
    R5:()=>[sizePage()]
  };
  const presets = {
    R4:[['副色逐一生成','@5 每个副色生成一次，上面该副色正面，下面同一个副色反面。'],['只改一个框','@1 的框1改为主色正面半身图。']],
    R1:[['明确右框颜色','@1 右框使用我在生产时指定的一个副色。']],
    R2:[['奇偶组合','奇数先用 @1 放主色，剩下两两用 @2；偶数全用 @2，主色排第一个。']],
    R3:[['按颜色数路由','一个色用 @1，两个色用 @2，三个色用 @3，四个色用 @4。']],
    R5:[['更新尺码数据','@6 根据本款尺码图换尺码数据。']]
  };
  let state = {scene:'R4',pages:scenes.R4(),nextAlias:7,version:1,refs:[],input:'',colorCount:5,explicitSecondary:false,manualRecipe:false,committed:false};
  let undo = [], activeDialog = '', overviewVersion = 0, overviewDigest = '', importItems = [], includeSubfolders = false, composing = false, focusBeforeDialog = null;
  let panelPreference = null;
  const localScroll = new Map();
  const previewScroll = new Map();
  const previewModes = new Map();
  const zoomModes = new Map();
  const viewSession = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
  const livePages = () => state.pages.filter(p=>!p.removed);
  const pageById = id => state.pages.find(p=>p.id===id);
  const byAlias = alias => state.pages.find(p=>p.alias===alias && !p.removed);
  const digest = () => JSON.stringify({pages:state.pages.map(({selected,externalName,...rules})=>rules),scene:state.scene,explicitSecondary:state.explicitSecondary,manualRecipe:state.manualRecipe});
  function remember() {
    const safe = clone(state); safe.input='';
    // Only synthetic demo state is eligible for optional host persistence.
    safe.pages=safe.pages.filter(p=>!p.externalName); safe.refs=safe.refs.filter(r=>safe.pages.some(p=>p.id===r.pageId));
    const snapshot={modelContent:{scene:state.scene,cardMinimum:design.cardMin,groupPanelWidth:design.panelWidth,localRuleWidth:design.localWidth},privateContent:{demo:safe,origin:viewSession}};
    if (JSON.stringify(snapshot).length<15000 && window.openai?.setWidgetState) window.openai.setWidgetState(snapshot).catch(()=>{});
  }
  function checkpoint(){undo.push(clone(state));if(undo.length>25)undo.shift();}
  function changed(message){state.version++;state.committed=false;updateHeader();renderPanel();renderRefs();if(message)announce(message);remember();}
  function announce(message){$('#tpl-message').textContent=message;}
  function updateHeader(){
    $('#tpl-page-count').textContent=`${livePages().length} 个 PSD`;
    $('#tpl-draft').textContent=`演示草稿 · v${state.version} · ${state.committed?'已模拟整体确认（未写入模板库）':'仅本原型状态，未写入模板库'}`;
    $('#tpl-undo').disabled=!undo.length;
  }
  function issues(){
    const list=[];
    if(!livePages().length)list.push({text:'尚未加入任何 PSD。'});
    for(const p of state.pages){
      if(p.removed && p.condition)list.push({pageId:p.id,text:`@${p.alias} 已移除，但组合规则仍引用它。请撤销移除或清除此引用。`,deleted:true});
      if(!p.removed&&!p.structure)list.push({pageId:p.id,text:`@${p.alias} 尚无真实结构证据（导入占位），不能发布可用模板。`});
      if(!p.removed){
        if(!p.condition.trim())list.push({pageId:p.id,text:`@${p.alias} 使用条件尚未填写。`});
        for(const f of p.frames)if(f.enabled&&!f.text.trim())list.push({pageId:p.id,frameId:f.id,text:`@${p.alias} 的${f.label}选图规则为空。`});
        if(state.scene==='R4'&&p.alias===5&&p.frames.some(f=>!f.enabled))list.push({pageId:p.id,text:'@5 的同色正反面关系仍引用已停止替换的框。'});
      }
    }
    if(state.scene==='R1'&&!state.explicitSecondary)list.push({pageId:byAlias(1)?.id,text:'存在多个副色时，右框选哪个？只需补充这一点，不默认取第一个副色。'});
    return list;
  }
  function reference(p, label, frameId=''){return `<button class="reference${p.removed?' invalid':''}" data-action="locate" data-page="${esc(p.id)}" data-frame="${esc(frameId)}">${esc(label||`@${p.alias}`)}${p.removed?' · 已失效':''}</button>`;}
  function replaceableTargets(p){
    if(!p.structure||!p.preview)return [];
    return p.frames.filter(f=>f.enabled).flatMap(f=>{
      const target=p.preview.targets.find(t=>t.layerId===f.layerId&&t.registered&&t.supported&&!t.decorative);
      if(!target)return [];
      const [left,top,width,height]=target.bounds;
      if(![left,top,width,height].every(Number.isFinite)||left<0||top<0||width<=0||height<=0||left+width>p.preview.width||top+height>p.preview.height)return [];
      return [{frame:f,left,top,width,height}];
    });
  }
  function sheet(p){
    if(!p.structure||!p.preview)return '<div class="preview-empty">尚未读取 PSD 预览与结构<br>不会凭空创建图片框</div>';
    const {width,height}=p.preview;
    return `<div class="psd-sheet" data-document="${p.id}" aria-label="${esc(p.name)} 文档坐标演示；尚未加载真实 PSD 预览"><div class="document-underlay"><span class="document-origin">文档坐标示例 · 非真实 PSD 预览</span>${p.preview.dividers.map(y=>`<div class="fixed-demo-content" style="top:${y*100}%"><span>固定内容示意 · 不可替换</span></div>`).join('')}</div>${replaceableTargets(p).map(({frame:f,left,top,width:w,height:h})=>`<button class="frame-hit${p.selected===f.id?' selected':''}" style="left:${left/width*100}%;top:${top/height*100}%;width:${w/width*100}%;height:${h/height*100}%" data-action="frame" data-page="${p.id}" data-frame="${f.id}" aria-label="选择 @${p.alias} 的${f.label}" aria-pressed="${p.selected===f.id}"><span class="frame-number">${esc(f.label)}</span></button>`).join('')}</div>`;
  }
  function card(p){
    const mode=previewModes.get(p.id)||'width';
    const isLong=p.preview&&p.preview.height/p.preview.width>2.5;
    return `<article class="page-card" data-page-card="${p.id}" aria-label="@${p.alias} ${esc(p.name)}">
      <header class="card-header"><span class="alias">${p.alias}</span><span class="file-title">${esc(p.name)}</span>
        <div class="preview-actions" aria-label="@${p.alias} 预览方式"><button data-action="view" data-page="${p.id}" data-mode="width" aria-pressed="${mode==='width'}">适宽</button><button data-action="view" data-page="${p.id}" data-mode="whole" aria-pressed="${mode==='whole'}">整页</button><button class="quiet" data-action="zoom" data-page="${p.id}">放大</button></div>
        <button class="quiet" data-action="remove" data-page="${p.id}" aria-label="移除 @${p.alias}">${icon('x')}</button></header>
      <div class="card-body"><div class="preview-column"><div class="preview-viewport" data-preview-page="${p.id}" role="region" aria-label="@${p.alias} PSD 预览，长页可上下滚动">${sheet(p)}</div></div>
        <section class="local-rules" aria-label="@${p.alias} 独立规则侧栏"><div class="local-head"><h3>${p.type==='size'?'尺码规则':'框选图规则'}</h3><span class="subtle">${replaceableTargets(p).length} 个替换目标</span></div>
          ${p.frames.map(f=>`<div class="rule-row${p.selected===f.id?' selected':''}" data-rule-row="${f.id}"><div class="rule-label"><button class="quiet rule-name" data-action="frame" data-page="${p.id}" data-frame="${f.id}">${esc(f.label)}</button><button class="quiet" data-action="toggle-frame" data-page="${p.id}" data-frame="${f.id}" aria-label="${f.enabled?'停止':'恢复'}替换 @${p.alias} 的${f.label}">${f.enabled?'停止替换':'恢复替换'}</button></div>${f.enabled?`<textarea rows="2" data-edit-frame="${f.id}" data-page="${p.id}" aria-label="@${p.alias} ${f.label}规则">${esc(f.text)}</textarea><div class="rule-evidence">${p.type==='size'?'建模板不需要本款尺码图':'演示绑定 · 非真实 PSD 解析'}</div>`:'<p class="subtle">保留模板内容，不删除 PSD 图层。</p>'}</div>`).join('')}
          <details><summary class="subtle">高级 / 结构与目标</summary><p class="subtle">仅显示已登记的可替换目标。固定背景、Logo 和未证实的智能对象不会加入。</p><button class="quiet" data-action="targets" data-page="${p.id}">查看受支持目标</button></details>
        </section></div>
      <footer class="card-footer"><span>${p.structure?`坐标演示 · ${p.preview.width} × ${p.preview.height}`:'占位卡片 · 未读取真实结构'}</span><span class="${isLong?'long-label':''}">${isLong?'长页 · 向下滚动，或点规则定位':'原比例 · 固定内容不参与替换'}</span></footer>
    </article>`;
  }
  function renderCards(){
    $$('.page-card').forEach(el=>localScroll.set(el.dataset.pageCard,el.querySelector('.local-rules').scrollTop));
    $$('.page-card .preview-viewport').forEach(el=>previewScroll.set(el.dataset.previewPage,{top:el.scrollTop,scale:Number(el.dataset.scale)||1}));
    $('#tpl-cards').innerHTML=livePages().map(card).join('');
    $$('.page-card').forEach(el=>{el.querySelector('.local-rules').scrollTop=localScroll.get(el.dataset.pageCard)||0;});
    icons();updateMetrics(true);
  }
  function layoutPreviews(restoreScroll=false){
    $$('.preview-viewport').forEach(viewport=>{
      const p=pageById(viewport.dataset.previewPage);
      const documentEl=viewport.querySelector('.psd-sheet');

      if(issues().length)return;state.committed=true;updateHeader();closeDialog();announce(`已模拟一次性确认 v${state.version}；未发布正式模板、未出图。`);remember();return;
    }
    if(a==='ai'){
      openDialog('ai','AI 读取规则','A 阶段：无真实 API 请求',`<p>正式功能会沿用上传授权与计费边界。普通结构扫描在本地进行，导入不触发 AI。</p><p class="subtle">这里仅体验返回状态；无 API 时仍可手工编辑与保存草稿。</p><div class="import-controls"><button data-action="ai-success">演示：读取完成</button><button data-action="ai-fail">演示：无 API / 请求失败</button><button data-action="ai-unknown">演示：结果未知</button></div>`, '<button data-action="close">取消</button>');return;
    }
    if(a.startsWith('ai-')){closeDialog();announce(a==='ai-success'?'模拟读取完成：当前演示规则默认采用，无需逐框确认；没有真实语义理解。':a==='ai-unknown'?'模拟结果未知：不自动重发，草稿保留。':'模拟请求失败 / 无 API：原草稿保留，可继续手工编辑和保存。');return;}
    if(a==='sample-files'){queueItem('07-新增展示.psd');queueItem('08-补充细节.psd');return;}
    if(a==='sample-folder'){queueItem('09-文件夹内模板.psd');queueItem('子目录/10-子目录模板.psd',{nested:true});return;}
    if(a==='sample-error'){queueItem('无法读取的模板.psd',{error:true});return;}
    if(a==='add-path'){const raw=$('#tpl-path').value.trim();if(!raw)return;if(/\.psd$/i.test(raw)){queueItem(raw.split(/[\\/]/).at(-1),{externalName:true});}else{queueItem(raw.split(/[\\/]/).filter(Boolean).at(-1)+'/演示模板.psd',{externalName:true});queueItem('子目录/演示模板.psd',{nested:true});}$('#tpl-path').value='';return;}
    if(a==='retry-import'){importItems[index].error=false;importItems[index].duplicate=livePages().some(p=>p.name===importItems[index].name);renderImportList();return;}
    if(a==='remove-import'){importItems.splice(index,1);renderImportList();return;}
    if(a==='import-confirm'){importConfirm();return;}
  });
  root.addEventListener('focusin',event=>{const el=event.target;if(el.matches('[data-edit-frame]')){selectFrame(el.dataset.page,el.dataset.editFrame);el.dataset.before=el.value;}if(el.matches('[data-edit-condition]'))el.dataset.before=el.value;if(!activeDialog)liftAboveComposer(el);});
  function updateComposerClearance(){
    const board=$('.board-scroll'),atEnd=board.scrollHeight-board.scrollTop-board.clientHeight<2;
    root.style.setProperty('--tp-composer-clearance',Math.ceil($('.composer').getBoundingClientRect().height+42)+'px');
    if(atEnd)board.scrollTop=board.scrollHeight;
  }
  function sizeComposer(){const input=$('#tpl-input');input.style.height='auto';input.style.height=Math.min(144,Math.max(48,input.scrollHeight))+'px';updateComposerClearance();}
  root.addEventListener('input',event=>{
    const el=event.target;
    if(el.id==='tpl-input'){state.input=el.value;sizeComposer();if(/@[^@\s]*$/.test(el.value))showSuggestions();else $('#tpl-suggestions').hidden=true;return;}
    if(el.dataset.editFrame){const p=pageById(el.dataset.page),f=p.frames.find(f=>f.id===el.dataset.editFrame);if(el.dataset.editing!=='yes'){checkpoint();el.dataset.editing='yes';}f.text=el.value;changed();return;}
    if(el.dataset.editCondition){const p=pageById(el.dataset.editCondition);if(el.dataset.editing!=='yes'){checkpoint();el.dataset.editing='yes';}p.condition=el.value;state.manualRecipe=true;state.version++;state.committed=false;updateHeader();remember();}
  });
  root.addEventListener('focusout',event=>{const el=event.target;if(el.dataset.editing){delete el.dataset.editing;if(el.dataset.editCondition)setTimeout(()=>renderPanel(),0);}});
  root.addEventListener('change',event=>{
    const el=event.target;
    if(el.id==='tpl-scene'){checkpoint();const scene=el.value;state={scene,pages:scenes[scene](),nextAlias:7,version:state.version+1,refs:[],input:'',colorCount:5,explicitSecondary:false,manualRecipe:false,committed:false};render();announce('已切换独立演示场景；未混用其他示例配方。');remember();}
    if(el.id==='tpl-colors'){state.colorCount=Number(el.value);renderPanel();remember();}
    if(el.id==='tpl-recursive'){includeSubfolders=el.checked;renderImportList();}
  });
  $('#tpl-input').addEventListener('compositionstart',()=>{composing=true;});
  $('#tpl-input').addEventListener('compositionend',()=>{composing=false;});
  root.addEventListener('keydown',event=>{
    if(event.key==='Escape'){$('#tpl-suggestions').hidden=true;}
    if(event.target.id==='tpl-input'&&event.key==='Enter'&&event.ctrlKey&&!event.isComposing&&!composing&&event.keyCode!==229){event.preventDefault();send();}
  });
  $('#tpl-dialog').addEventListener('cancel',()=>{activeDialog='';});
  root.addEventListener('dragover',event=>{if([...event.dataTransfer.types].includes('Files')){event.preventDefault();$('.product-shell').classList.add('drop-active');}});
  root.addEventListener('dragleave',event=>{if(!root.contains(event.relatedTarget))$('.product-shell').classList.remove('drop-active');});
  root.addEventListener('drop',event=>{
    event.preventDefault();$('.product-shell').classList.remove('drop-active');showImport();
    const entries=[...event.dataTransfer.items].filter(i=>i.kind==='file');
    if(!entries.length){announce('未收到文件条目；可以在统一导入容器中加入演示清单。');return;}
    for(const item of entries){const entry=item.webkitGetAsEntry?.();const file=item.getAsFile();if(entry?.isDirectory){queueItem(entry.name+'/演示模板.psd',{externalName:true});queueItem(entry.name+'/子目录/演示模板.psd',{nested:true,externalName:true});}else if(file)queueItem(file.name,{error:!/\.psd$/i.test(file.name),externalName:true});}
  });
  render();restore(window.openai?.widgetState);responsive();
  new ResizeObserver(responsive).observe(root);
  new ResizeObserver(updateComposerClearance).observe($('.composer'));
  window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState)restore(event.detail.globals.widgetState);});
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{root.style.setProperty('--tp-card-min',design.cardMin+'px');root.style.setProperty('--tp-panel-width',design.panelWidth+'px');root.style.setProperty('--tp-local-width',design.localWidth+'px');updateMetrics();remember();}});tweak.addSlider(design,'cardMin',{label:'卡片最小宽度',min:440,max:500,step:10,unit:'px'});tweak.addSlider(design,'localWidth',{label:'每 PSD 规则栏宽度',min:180,max:240,step:10,unit:'px'});tweak.addSlider(design,'panelWidth',{label:'总规则栏宽度',min:280,max:360,step:20,unit:'px'});}
})();
</script>
